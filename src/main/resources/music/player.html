<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DND|{"phase":"loading"}</title>
<style>body{margin:0;background:#111} .p{width:320px;height:180px;display:inline-block}</style>
</head>
<body>
<div class="p"><div id="a"></div></div><div class="p"><div id="b"></div></div><div class="p"><div id="fx"></div></div><div class="p"><div id="amb"></div></div>
<script>
// Two music decks (A/B) so a new playlist can crossfade in over the old one, plus a third
// deck for one-shot sound effects and a fourth for looping ambience (rain, river, wind...). Java drives this page through window.dnd.* and reads its state
// from document.title, which JCEF reports back on every change.
var dnd = (function () {
  var decks = [], ready = 0, active = 0;
  var fx = null, fxPlaying = false, amb = null, ambId = null, ambStart = 0, ambFade = null;
  var queue = [], index = -1, shuffle = false, loop = true, volume = 60, fxVolume = 80;
  var paused = false, lastError = null, errorStreak = 0, ducked = false;
  var fades = [null, null];

  function report(extra) {
    var d = decks[active], title = '', state = -1, t = 0, dur = 0;
    try {
      if (d && d.getVideoData) { title = (d.getVideoData() || {}).title || ''; state = d.getPlayerState(); t = d.getCurrentTime(); dur = d.getDuration(); }
    } catch (e) {}
    var s = { phase: ready >= 4 ? 'ready' : 'loading', state: state, title: title, index: index,
              count: queue.length, t: Math.round(t), dur: Math.round(dur), paused: paused, error: lastError, fx: fxPlaying, ducked: ducked, amb: ambId };
    if (extra) for (var k in extra) s[k] = extra[k];
    document.title = 'DND|' + JSON.stringify(s);
  }

  function musicVolume() { return ducked ? Math.round(volume * 0.4) : volume; }

  function fade(i, from, to, ms, done) {
    if (fades[i]) clearInterval(fades[i]);
    var d = decks[i], steps = Math.max(1, Math.round(ms / 50)), n = 0;
    d.setVolume(from);
    fades[i] = setInterval(function () {
      n++;
      d.setVolume(Math.round(from + (to - from) * n / steps));
      if (n >= steps) { clearInterval(fades[i]); fades[i] = null; if (done) done(); }
    }, 50);
  }

  function load(i, item) {
    var d = decks[i];
    if (item.l) {
      d.loadPlaylist({ list: item.l, listType: 'playlist', index: 0, startSeconds: item.s || 0 });
      if (shuffle) setTimeout(function () { try { d.setShuffle(true); } catch (e) {} }, 1500);
    } else {
      d.loadVideoById({ videoId: item.v, startSeconds: item.s || 0 });
    }
  }

  function playIndex(i, fadeMs) {
    if (!queue.length) return;
    index = i;
    paused = false;
    var from = active, to = 1 - active;
    var fromWasPlaying = false;
    try { var st = decks[from].getPlayerState(); fromWasPlaying = st === 1 || st === 3; } catch (e) {}
    active = to;
    decks[to].setVolume(0);
    load(to, queue[i]);
    if (fromWasPlaying && fadeMs > 0) {
      fade(from, musicVolume(), 0, fadeMs, function () { try { decks[from].stopVideo(); } catch (e) {} });
      fade(to, 0, musicVolume(), fadeMs);
    } else {
      try { decks[from].stopVideo(); } catch (e) {}
      fade(to, 0, musicVolume(), fadeMs > 0 ? Math.min(fadeMs, 1500) : 50);
    }
    report();
  }

  function nextIndex() {
    if (queue.length === 0) return -1;
    if (shuffle && queue.length > 1) {
      var n; do { n = Math.floor(Math.random() * queue.length); } while (n === index);
      return n;
    }
    if (index + 1 < queue.length) return index + 1;
    return loop ? 0 : -1;
  }

  function advance() {
    var n = nextIndex();
    if (n < 0) { index = -1; report(); return; }
    playIndex(n, 1500);
  }

  function onState(i) {
    return function (e) {
      if (i !== active) return;
      if (e.data === 1) { errorStreak = 0; lastError = null; }
      if (e.data === 0) {
        var d = decks[i];
        try {
          var list = d.getPlaylist();
          if (list && d.getPlaylistIndex() < list.length - 1) return;
        } catch (err) {}
        advance();
      }
      report();
    };
  }

  function onError(i) {
    return function (e) {
      if (i !== active) return;
      var code = e.data;
      lastError = (code === 101 || code === 150) ? 'This video does not allow being played outside YouTube - skipped.'
        : (code === 100 ? 'Video not found (removed or private) - skipped.' : 'YouTube error ' + code + ' - skipped.');
      errorStreak++;
      if (errorStreak < queue.length) advance(); else report();
      report();
    };
  }

  function make(id, onStateChange, onErr) {
    return new YT.Player(id, {
      width: 320, height: 180,
      playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0 },
      events: { onReady: function () { ready++; report(); }, onStateChange: onStateChange, onError: onErr }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    decks[0] = make('a', onState(0), onError(0));
    decks[1] = make('b', onState(1), onError(1));
    fx = make('fx', function (e) {
      if (e.data === 1) fxPlaying = true;
      if (e.data === 0 || e.data === 2 || e.data === 5) {
        if (fxPlaying && ducked) { ducked = false; try { decks[active].setVolume(volume); } catch (x) {} }
        fxPlaying = false;
      }
    }, function () {
      if (ducked) { ducked = false; try { decks[active].setVolume(volume); } catch (x) {} }
      lastError = 'That sound effect cannot be played.'; report();
    });
    amb = make('amb', function (e) {
      // Ambience loops until it is stopped.
      if (e.data === 0 && ambId) { try { amb.seekTo(ambStart, true); amb.playVideo(); } catch (x) {} }
    }, function () {
      ambId = null; lastError = 'That ambience cannot be played.'; report();
    });
    setInterval(report, 1000);
  };

  return {
    play: function (items, start, fadeMs) {
      queue = items || [];
      errorStreak = 0; lastError = null;
      if (!queue.length) return;
      var i = start;
      if (i < 0 || i >= queue.length) i = shuffle ? Math.floor(Math.random() * queue.length) : 0;
      playIndex(i, fadeMs);
    },
    pause: function () { paused = true; try { decks[active].pauseVideo(); } catch (e) {} report(); },
    resume: function () { paused = false; try { decks[active].playVideo(); } catch (e) {} report(); },
    next: function () {
      var d = decks[active];
      try { var list = d.getPlaylist(); if (list && d.getPlaylistIndex() < list.length - 1) { d.nextVideo(); return; } } catch (e) {}
      advance();
    },
    prev: function () {
      var d = decks[active];
      try { var list = d.getPlaylist(); if (list && d.getPlaylistIndex() > 0) { d.previousVideo(); return; } } catch (e) {}
      if (!queue.length) return;
      playIndex(index > 0 ? index - 1 : queue.length - 1, 800);
    },
    stop: function (fadeMs) {
      var i = active; queue = []; index = -1; paused = false;
      fade(i, musicVolume(), 0, Math.max(50, fadeMs || 0), function () { try { decks[i].stopVideo(); } catch (e) {} report(); });
    },
    setVolume: function (v) { volume = v; if (!fades[active]) try { decks[active].setVolume(musicVolume()); } catch (e) {} },
    setFxVolume: function (v) { fxVolume = v; try { fx.setVolume(v); } catch (e) {} try { amb.setVolume(v); } catch (e) {} },
    setShuffle: function (b) { shuffle = b; },
    setLoop: function (b) { loop = b; },
    sfx: function (videoId, start, end) {
      lastError = null;
      var opts = { videoId: videoId, startSeconds: start || 0 };
      if (end > 0) opts.endSeconds = end;
      fx.setVolume(fxVolume);
      fx.loadVideoById(opts);
      try { var st = decks[active].getPlayerState(); if (st === 1) { ducked = true; decks[active].setVolume(musicVolume()); } } catch (e) {}
    },
    stopSfx: function () { try { fx.stopVideo(); } catch (e) {} },
    ambience: function (videoId, start) {
      ambId = videoId; ambStart = start || 0; lastError = null;
      if (ambFade) clearInterval(ambFade);
      amb.setVolume(0);
      amb.loadVideoById({ videoId: videoId, startSeconds: ambStart });
      var a = amb, n = 0;
      ambFade = setInterval(function () {
        n++; try { a.setVolume(Math.round(fxVolume * n / 40)); } catch (e) {}
        if (n >= 40) { clearInterval(ambFade); ambFade = null; }
      }, 50);
      report();
    },
    stopAmbience: function () {
      var a = amb, v = fxVolume, n = 0;
      ambId = null; report();
      if (ambFade) clearInterval(ambFade);
      ambFade = setInterval(function () {
        n++; try { a.setVolume(Math.round(v * (1 - n / 30))); } catch (e) {}
        if (n >= 30) { clearInterval(ambFade); ambFade = null; try { a.stopVideo(); } catch (e) {} }
      }, 50);
    }
  };
})();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
